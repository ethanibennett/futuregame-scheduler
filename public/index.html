              <button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button>
            </div>
            <div className="staking-modal-body">
              {error && <div style={{color:'#ef4444',fontSize:12,marginBottom:8}}>{error}</div>}
              <label className="staking-field"><span>Series *</span>
                <select value={name} onChange={e => {
                  const v = e.target.value;
                  setName(v);
                  if (v) setVenue(v);
                }}>
                  <option value="">Select a series…</option>
                  {venueOptions.map(v => <option key={v} value={v}>{v}</option>)}
                </select>
              </label>
              <label className="staking-field"><span>Venue</span>
                <input type="text" value={venue} onChange={e => setVenue(e.target.value)} placeholder="Auto-filled from series" />
              </label>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                <label className="staking-field"><span>Start Date</span>
                  <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} />
                </label>
                <label className="staking-field"><span>End Date</span>
                  <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} />
                </label>
              </div>
              <label className="staking-field"><span>Currency</span>
                <select value={currency} onChange={e => setCurrency(e.target.value)}>
                  {['USD','EUR','GBP','CAD','AUD','CNY','JPY','CHF','SEK','NOK','DKK','MXN','BRL'].map(c => <option key={c}>{c}</option>)}
                </select>
              </label>
            </div>
            <div className="staking-modal-footer">
              {series && <button className="btn btn-ghost btn-sm" style={{color:'#ef4444'}} onClick={handleDelete}>Delete</button>}
              <div style={{flex:1}} />
              <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancel</button>
              <button className="create-group-submit" style={{fontSize:13,padding:'8px 20px'}} onClick={handleSave} disabled={saving}>
                {saving ? 'Saving…' : 'Save'}
              </button>
            </div>
          </div>
        </div>,
        document.body
      );
    }

    // ── Backer Manager ──────────────────────────────────────────

    function BackerManager({ token, backers, fetchBackers, onBack }) {
      const [showForm, setShowForm] = useState(false);
      const [editBacker, setEditBacker] = useState(null);
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [phone, setPhone] = useState('');
      const [notes, setNotes] = useState('');
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState('');

      const resetForm = () => { setName(''); setEmail(''); setPhone(''); setNotes(''); setEditBacker(null); setShowForm(false); setError(''); };

      const openEdit = (b) => {
        setEditBacker(b); setName(b.name); setEmail(b.email || ''); setPhone(b.phone || ''); setNotes(b.notes || ''); setShowForm(true);
      };

      const handleSave = async () => {
        if (!name.trim()) { setError('Name is required'); return; }
        setSaving(true); setError('');
        try {
          const body = { name: name.trim(), email: email || undefined, phone: phone || undefined, notes: notes || undefined };
          const url = editBacker ? `${API_URL}/staking/backers/${editBacker.id}` : `${API_URL}/staking/backers`;
          const res = await fetch(url, {
            method: editBacker ? 'PUT' : 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if (res.ok) { resetForm(); fetchBackers(); } else {
            const d = await res.json(); setError(d.error || 'Failed');
          }
        } catch { setError('Network error'); }
        setSaving(false);
      };

      const handleDelete = async (id) => {
        if (!confirm('Delete this backer?')) return;
        try {
          const res = await fetch(`${API_URL}/staking/backers/${id}`, {
            method: 'DELETE', headers: { Authorization: `Bearer ${token}` }
          });
          if (!res.ok) { const d = await res.json(); alert(d.error || 'Failed'); }
          else fetchBackers();
        } catch {}
      };

      return (
        <div>
          <div className="group-detail-header">
            <button className="group-back-btn" onClick={onBack}>←</button>
            <div style={{flex:1}}><div className="social-buddy-name" style={{fontSize:16}}>Backers</div></div>
            <button className="create-group-submit" style={{fontSize:12,padding:'6px 14px'}} onClick={() => { resetForm(); setShowForm(!showForm); }}>
              {showForm ? 'Cancel' : '+ Add'}
            </button>
          </div>

          {showForm && (
            <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)'}}>
              {error && <div style={{color:'#ef4444',fontSize:12,marginBottom:8}}>{error}</div>}
              <label className="staking-field"><span>Name *</span>
                <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Backer name" />
              </label>
              <label className="staking-field"><span>Email</span>
                <input type="text" value={email} onChange={e => setEmail(e.target.value)} placeholder="email@example.com" />
              </label>
              <label className="staking-field"><span>Phone</span>
                <input type="text" value={phone} onChange={e => setPhone(e.target.value)} placeholder="Phone number" />
              </label>
              <label className="staking-field"><span>Notes</span>
                <input type="text" value={notes} onChange={e => setNotes(e.target.value)} placeholder="Notes" />
              </label>
              <button className="create-group-submit" style={{fontSize:13,padding:'8px 20px',width:'100%'}} onClick={handleSave} disabled={saving}>
                {saving ? 'Saving…' : editBacker ? 'Update Backer' : 'Add Backer'}
              </button>
            </div>
          )}

          <div style={{padding:'12px 16px'}}>
            {backers.length === 0 ? (
              <div className="empty-state">
                <Icon.people />
                <h3>No backers yet</h3>
                <p>Add your backers to start creating staking agreements</p>
              </div>
            ) : backers.map(b => (
              <div key={b.id} className="staking-backer-card">
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:14}}>{b.name}</div>
                  {b.email && <div style={{fontSize:12,color:'var(--text-secondary)'}}>{b.email}</div>}
                  {b.phone && <div style={{fontSize:12,color:'var(--text-muted)'}}>{b.phone}</div>}
                  {b.notes && <div style={{fontSize:11,color:'var(--text-muted)',fontStyle:'italic',marginTop:2}}>{b.notes}</div>}
                </div>
                <div style={{display:'flex',gap:6}}>
                  <button className="btn btn-ghost btn-sm" onClick={() => openEdit(b)} style={{fontSize:11}}>Edit</button>
                  <button className="btn btn-ghost btn-sm" onClick={() => handleDelete(b.id)} style={{fontSize:11,color:'#ef4444'}}>✕</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── Series Detail View ──────────────────────────────────────

    function StakingSeriesDetail({ series, token, backers, tournaments, mySchedule, fetchSeries, onBack, onEdit }) {
      const [segment, setSegment] = useState('agreements');
      const [agreements, setAgreements] = useState([]);
      const [showAgreementForm, setShowAgreementForm] = useState(false);
      const [eventStatuses, setEventStatuses] = useState([]);
      const [settlementData, setSettlementData] = useState(null);

      const fetchAgreements = async () => {
        try {
          const res = await fetch(`${API_URL}/staking/series/${series.id}/agreements`, { headers: { Authorization: `Bearer ${token}` } });
          if (res.ok) setAgreements(await res.json());
        } catch {}
      };

      const fetchEvents = async () => {
        try {
          const res = await fetch(`${API_URL}/staking/series/${series.id}/events`, { headers: { Authorization: `Bearer ${token}` } });
          if (res.ok) setEventStatuses(await res.json());
        } catch {}
      };

      const fetchSettlement = async () => {
        try {
          const res = await fetch(`${API_URL}/staking/series/${series.id}/settlement`, { headers: { Authorization: `Bearer ${token}` } });
          if (res.ok) setSettlementData(await res.json());
        } catch {}
      };

      useEffect(() => { fetchAgreements(); }, [series.id]);
      useEffect(() => {
        if (segment === 'events') fetchEvents();
        if (segment === 'settlement') fetchSettlement();
      }, [segment, series.id]);

      const totalPct = useMemo(() => agreements.filter(a => a.is_active && a.backer_type !== 'profit_share_only').reduce((s, a) => s + (a.percentage || 0), 0), [agreements]);

      return (
        <div className="group-detail-view">
          <div className="group-detail-header">
            <button className="group-back-btn" onClick={onBack}>←</button>
            <div style={{flex:1}}>
              <div className="social-buddy-name" style={{fontSize:16}}>{series.name}</div>
              <div style={{fontSize:12,color:'var(--text-secondary)'}}>
                {agreements.length} agreement{agreements.length !== 1 ? 's' : ''} · {totalPct}% sold
              </div>
            </div>
            <span className={`staking-badge staking-badge-${series.status}`}>
              {series.status === 'pre' ? 'Pre' : series.status === 'active' ? 'Active' : 'Settled'}
            </span>
            <button className="btn btn-ghost btn-sm" onClick={onEdit} style={{fontSize:12,marginLeft:4}}>✎</button>
          </div>

          <div className="group-segments">
            {['agreements', 'events', 'settlement'].map(s => (
              <button key={s} className={`group-segment-btn${segment === s ? ' active' : ''}`} onClick={() => setSegment(s)}>
                {s === 'agreements' ? 'Agreements' : s === 'events' ? 'Events' : 'Settlement'}
              </button>
            ))}
          </div>

          {segment === 'agreements' && (
            <AgreementsList
              agreements={agreements}
              token={token}
              seriesId={series.id}
              backers={backers}
              fetchAgreements={fetchAgreements}
              onAdd={() => setShowAgreementForm(true)}
            />
          )}

          {segment === 'events' && (
            <StakingEventTracking
              seriesId={series.id}
              agreements={agreements}
              eventStatuses={eventStatuses}
              tournaments={tournaments}
              mySchedule={mySchedule}
              series={series}
              token={token}
              fetchEvents={fetchEvents}
            />
          )}

          {segment === 'settlement' && (
            <StakingSettlementView
              seriesId={series.id}
              settlementData={settlementData}
              token={token}
              fetchSettlement={fetchSettlement}
              fetchSeries={fetchSeries}
            />
          )}

          {showAgreementForm && (
            <AgreementForm
              token={token}
              seriesId={series.id}
              backers={backers}
              tournaments={tournaments}
              onClose={() => setShowAgreementForm(false)}
              onSaved={() => { setShowAgreementForm(false); fetchAgreements(); }}
            />
          )}
        </div>
      );
    }

    function AgreementsList({ agreements, token, seriesId, backers, fetchAgreements, onAdd }) {
      const handleDelete = async (id) => {
        if (!confirm('Delete this agreement?')) return;
        try {
          await fetch(`${API_URL}/staking/agreements/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
          fetchAgreements();
        } catch {}
      };

      const toggleActive = async (ag) => {
        try {
          await fetch(`${API_URL}/staking/agreements/${ag.id}`, {
            method: 'PUT',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ isActive: ag.is_active ? false : true })
          });
          fetchAgreements();
        } catch {}
      };

      return (
        <div style={{padding:'12px 16px'}}>
          <button className="create-group-submit" style={{fontSize:13,padding:'8px 16px',marginBottom:12,width:'100%'}} onClick={onAdd}>
            + Add Agreement
          </button>

          {agreements.length === 0 ? (
            <div style={{textAlign:'center',color:'var(--text-secondary)',padding:'30px 20px',fontSize:13}}>
              No agreements yet. Add a backer agreement to get started.
            </div>
          ) : agreements.map(ag => (
            <div key={ag.id} className={`staking-agreement-card${ag.is_active ? '' : ' inactive'}`}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div style={{minWidth:0,flex:1}}>
                  <div style={{fontWeight:600,fontSize:14}}>{ag.backer_name}</div>
                  <div style={{display:'flex',gap:6,alignItems:'center',marginTop:4,flexWrap:'wrap'}}>
                    <span className="staking-type-badge">{BACKER_TYPE_LABELS[ag.backer_type] || ag.backer_type}</span>
                    {ag.backer_type !== 'profit_share_only' && ag.percentage > 0 && (
                      <span style={{fontSize:12,color:'var(--text-secondary)'}}>{ag.percentage}%</span>
                    )}
                    {ag.markup > 1 && <span style={{fontSize:12,color:'var(--accent)'}}>{ag.markup}x markup</span>}
                    {ag.backer_type === 'profit_share_only' && <span style={{fontSize:12,color:'var(--text-secondary)'}}>{ag.percentage}% of profit</span>}
                  </div>
                  {(ag.buyin_range_min || ag.buyin_range_max) && (
                    <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>
                      Buyin range: {ag.buyin_range_min ? formatBuyin(ag.buyin_range_min) : '$0'} – {ag.buyin_range_max ? formatBuyin(ag.buyin_range_max) : '∞'}
                    </div>
                  )}
                  {(ag.scope === 'custom_dates' || ag.variant_filter || ag.start_date) && (
                    <div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:4}}>
                      {ag.scope === 'custom_dates' && ag.start_date && (
                        <span style={{fontSize:10,background:'var(--bg-hover)',padding:'1px 6px',borderRadius:4,color:'var(--text-muted)'}}>
                          {ag.start_date}{ag.end_date ? ` → ${ag.end_date}` : '+'}
                        </span>
                      )}
                      {ag.variant_filter && (() => {
                        try { const vf = JSON.parse(ag.variant_filter); return vf.map(v => (
                          <span key={v} style={{fontSize:10,background:'var(--bg-hover)',padding:'1px 6px',borderRadius:4,color:'var(--text-muted)'}}>{v}</span>
                        )); } catch { return null; }
                      })()}
                    </div>
                  )}
                </div>
                <div style={{display:'flex',gap:4,alignItems:'center'}}>
                  <label className="toggle-switch" style={{width:32,height:18}} title={ag.is_active ? 'Active' : 'Inactive'}>
                    <input type="checkbox" checked={!!ag.is_active} onChange={() => toggleActive(ag)} />
                    <span className="toggle-slider" />
                  </label>
                  <button className="btn btn-ghost btn-sm" onClick={() => handleDelete(ag.id)} style={{fontSize:11,color:'#ef4444',padding:'2px 4px'}}>✕</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function AgreementForm({ token, seriesId, backers, onClose, onSaved, tournaments }) {
      const [backerId, setBackerId] = useState('');
      const [backerType, setBackerType] = useState('pay_per_play');
      const [percentage, setPercentage] = useState('');
      const [markup, setMarkup] = useState('1.0');
      const [buyinMin, setBuyinMin] = useState('');
      const [buyinMax, setBuyinMax] = useState('');
      const [scope, setScope] = useState('series');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [variantFilter, setVariantFilter] = useState([]);
      const [showAdvanced, setShowAdvanced] = useState(false);
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState('');

      const availableVariants = useMemo(() => {
        if (!tournaments || tournaments.length === 0) return [];
        const variants = new Set();
        tournaments.forEach(t => { if (t.game_variant) variants.add(t.game_variant); });
        return [...variants].sort();
      }, [tournaments]);

      const mvpTypes = ['pay_per_play', 'flat_package', 'profit_share_only'];

      const handleSave = async () => {
        if (!backerId) { setError('Select a backer'); return; }
        const pct = parseFloat(percentage);
        if (isNaN(pct) || pct <= 0 || pct > 100) { setError('Percentage must be 1–100'); return; }
        const mkp = parseFloat(markup);
        if (backerType !== 'profit_share_only' && (isNaN(mkp) || mkp < 1)) { setError('Markup must be ≥ 1.0'); return; }
        setSaving(true); setError('');
        try {
          const body = {
            backerId: Number(backerId),
            backerType,
            percentage: pct,
            markup: backerType === 'profit_share_only' ? 1.0 : mkp,
            buyinRangeMin: buyinMin ? Number(buyinMin) : undefined,
            buyinRangeMax: buyinMax ? Number(buyinMax) : undefined,
            scope,
            startDate: startDate || undefined,
            endDate: endDate || undefined,
            variantFilter: variantFilter.length > 0 ? variantFilter : undefined,
            buyinMin: buyinMin ? Number(buyinMin) : undefined,
            buyinMax: buyinMax ? Number(buyinMax) : undefined,
          };
          const res = await fetch(`${API_URL}/staking/series/${seriesId}/agreements`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if (res.ok) onSaved();
          else { const d = await res.json(); setError(d.error || 'Failed'); }
        } catch { setError('Network error'); }
        setSaving(false);
      };

      return ReactDOM.createPortal(
        <div className="notif-backdrop" onClick={onClose}>
          <div className="staking-modal" onClick={e => e.stopPropagation()}>
            <div className="staking-modal-header">
              <h3 style={{margin:0,fontSize:16,fontWeight:600}}>Add Agreement</h3>
              <button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button>
            </div>
            <div className="staking-modal-body">
              {error && <div style={{color:'#ef4444',fontSize:12,marginBottom:8}}>{error}</div>}

              <label className="staking-field"><span>Backer *</span>
                <select value={backerId} onChange={e => setBackerId(e.target.value)}>
                  <option value="">Select a backer…</option>
                  {backers.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                </select>
              </label>

              <div className="staking-field"><span>Type</span>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  {mvpTypes.map(t => (
                    <button key={t} className={`filter-chip${backerType === t ? ' active' : ''}`} onClick={() => setBackerType(t)}>
                      {BACKER_TYPE_LABELS[t]}
                    </button>
                  ))}
                </div>
              </div>

              <label className="staking-field"><span>Percentage *</span>
                <input type="number" value={percentage} onChange={e => setPercentage(e.target.value)} placeholder="e.g. 50" min="1" max="100" step="1" />
              </label>

              {backerType !== 'profit_share_only' && (
                <label className="staking-field"><span>Markup</span>
                  <input type="number" value={markup} onChange={e => setMarkup(e.target.value)} placeholder="1.0 = no markup" min="1" step="0.1" />
                </label>
              )}

              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                <label className="staking-field"><span>Min Buyin</span>
                  <input type="number" value={buyinMin} onChange={e => setBuyinMin(e.target.value)} placeholder="Optional" />
                </label>
                <label className="staking-field"><span>Max Buyin</span>
                  <input type="number" value={buyinMax} onChange={e => setBuyinMax(e.target.value)} placeholder="Optional" />
                </label>
              </div>

              <button className="btn btn-ghost btn-sm" style={{fontSize:11,color:'var(--text-muted)',marginTop:4,padding:'4px 0'}} onClick={() => setShowAdvanced(!showAdvanced)}>
                {showAdvanced ? '▾ Hide Advanced' : '▸ Advanced Options'}
              </button>

              {showAdvanced && (
                <div style={{borderTop:'1px solid var(--border)',paddingTop:10,marginTop:4}}>
                  <div className="staking-field"><span>Scope</span>
                    <div style={{display:'flex',gap:6}}>
                      {['series','custom_dates'].map(s => (
                        <button key={s} className={`filter-chip${scope === s ? ' active' : ''}`}
                          onClick={() => setScope(s)}>{s === 'series' ? 'Full Series' : 'Custom Dates'}</button>
                      ))}
                    </div>
                  </div>

                  {scope === 'custom_dates' && (
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                      <label className="staking-field"><span>Start Date</span>
                        <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} />
                      </label>
                      <label className="staking-field"><span>End Date</span>
                        <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} />
                      </label>
                    </div>
                  )}

                  {availableVariants.length > 0 && (
                    <div className="staking-field"><span>Game Filter</span>
                      <div style={{display:'flex',gap:4,flexWrap:'wrap',maxHeight:80,overflowY:'auto'}}>
                        {availableVariants.map(v => (
                          <button key={v} className={`filter-chip${variantFilter.includes(v) ? ' active' : ''}`}
                            style={{fontSize:10,padding:'2px 8px'}}
                            onClick={() => setVariantFilter(f => f.includes(v) ? f.filter(x => x !== v) : [...f, v])}
                          >{v}</button>
                        ))}
                      </div>
                      {variantFilter.length > 0 && (
                        <div style={{fontSize:10,color:'var(--text-muted)',marginTop:2}}>
                          {variantFilter.length} game{variantFilter.length !== 1 ? 's' : ''} selected
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>
            <div className="staking-modal-footer">
              <div style={{flex:1}} />
              <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancel</button>
              <button className="create-group-submit" style={{fontSize:13,padding:'8px 20px'}} onClick={handleSave} disabled={saving}>
                {saving ? 'Saving…' : 'Add'}
              </button>
            </div>
          </div>
        </div>,
        document.body
      );
    }

    // ── Staking Event Tracking ──────────────────────────────────

    function StakingEventTracking({ seriesId, agreements, eventStatuses, tournaments, mySchedule, series, token, fetchEvents }) {
      const [logFor, setLogFor] = useState(null); // { agreementId, tournamentId }
      const [bullets, setBullets] = useState('1');
      const [buyinAmt, setBuyinAmt] = useState('');
      const [cashAmt, setCashAmt] = useState('');
      const [tipAmt, setTipAmt] = useState('');
      const [saving, setSaving] = useState(false);

      // Get tournaments from user's schedule that fall within series date range
      const seriesEvents = useMemo(() => {
        if (!mySchedule || !tournaments) return [];
        const schedIds = new Set(mySchedule.map(s => s.tournament_id || s.id));
        return tournaments.filter(t => {
          if (!schedIds.has(t.id)) return false;
          if (series.start_date && t.date < series.start_date) return false;
          if (series.end_date && t.date > series.end_date) return false;
          return true;
        }).sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));
      }, [mySchedule, tournaments, series]);

      // Build lookup: { tournamentId_agreementId -> status }
      const statusMap = useMemo(() => {
        const m = {};
        for (const es of eventStatuses) {
          m[`${es.tournament_id}_${es.agreement_id}`] = es;
        }
        return m;
      }, [eventStatuses]);

      const handleLog = async () => {
        if (!logFor) return;
        setSaving(true);
        try {
          await fetch(`${API_URL}/staking/events/${logFor.agreementId}/${logFor.tournamentId}/status`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              bulletsUsed: Number(bullets) || 1,
              buyinAmount: Number(buyinAmt) || 0,
              cashAmount: Number(cashAmt) || 0,
              tipAmount: Number(tipAmt) || 0,
            })
          });
          setLogFor(null); setBullets('1'); setBuyinAmt(''); setCashAmt(''); setTipAmt('');
          fetchEvents();
        } catch {}
        setSaving(false);
      };

      const activeAgreements = agreements.filter(a => a.is_active);

      if (activeAgreements.length === 0) {
        return <div style={{textAlign:'center',color:'var(--text-secondary)',padding:'30px 20px',fontSize:13}}>Add active agreements first to track events.</div>;
      }

      if (seriesEvents.length === 0) {
        return <div style={{textAlign:'center',color:'var(--text-secondary)',padding:'30px 20px',fontSize:13}}>No scheduled tournaments in this series date range.</div>;
      }

      return (
        <div style={{padding:'12px 16px'}}>
          {seriesEvents.map(t => (
            <div key={t.id} className="staking-event-card">
              <div style={{fontWeight:600,fontSize:13}}>{t.event_name}</div>
              <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:6}}>{t.date} · {t.time} · {formatBuyin(t.buyin)}</div>
              {activeAgreements.map(ag => {
                const key = `${t.id}_${ag.id}`;
                const status = statusMap[key];
                const isLogging = logFor && logFor.agreementId === ag.id && logFor.tournamentId === t.id;
                return (
                  <div key={ag.id} style={{borderTop:'1px solid var(--border)',padding:'6px 0'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <div style={{fontSize:12}}>
                        <span style={{fontWeight:500}}>{ag.backer_name}</span>
                        <span style={{color:'var(--text-muted)',marginLeft:4}}>{ag.percentage}%</span>
                      </div>
                      {status ? (
                        <div style={{fontSize:11}}>
                          <span style={{color:'var(--text-muted)'}}>B:{status.bullets_used || 1}</span>
                          <span style={{marginLeft:6,color:'var(--text-secondary)'}}>In:{formatBuyin(status.buyin_amount || 0)}</span>
                          <span style={{marginLeft:6,color: (status.cash_amount || 0) > 0 ? '#22c55e' : 'var(--text-muted)'}}>
                            Out:{formatBuyin(status.cash_amount || 0)}
                          </span>
                        </div>
                      ) : (
                        <button className="btn btn-ghost btn-sm" style={{fontSize:11,color:'var(--accent)'}} onClick={() => {
                          setLogFor({ agreementId: ag.id, tournamentId: t.id });
                          setBuyinAmt(String(t.buyin || ''));
                        }}>Log</button>
                      )}
                    </div>
                    {isLogging && (
                      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:6,marginTop:6}}>
                        <label className="staking-field" style={{marginBottom:0}}><span style={{fontSize:10}}>Bullets</span>
                          <input type="number" value={bullets} onChange={e => setBullets(e.target.value)} min="1" />
                        </label>
                        <label className="staking-field" style={{marginBottom:0}}><span style={{fontSize:10}}>Buyin</span>
                          <input type="number" value={buyinAmt} onChange={e => setBuyinAmt(e.target.value)} />
                        </label>
                        <label className="staking-field" style={{marginBottom:0}}><span style={{fontSize:10}}>Cash</span>
                          <input type="number" value={cashAmt} onChange={e => setCashAmt(e.target.value)} />
                        </label>
                        <label className="staking-field" style={{marginBottom:0}}><span style={{fontSize:10}}>Tip</span>
                          <input type="number" value={tipAmt} onChange={e => setTipAmt(e.target.value)} />
                        </label>
                        <div style={{gridColumn:'span 4',display:'flex',gap:6}}>
                          <button className="create-group-submit" style={{fontSize:11,padding:'6px 12px',flex:1}} onClick={handleLog} disabled={saving}>
                            {saving ? '…' : 'Save'}
                          </button>
                          <button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={() => setLogFor(null)}>Cancel</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      );
    }

    // ── Staking Settlement ──────────────────────────────────────

    function StakingSettlementView({ seriesId, settlementData, token, fetchSettlement, fetchSeries }) {
      const [settling, setSettling] = useState(false);

      const handleFinalize = async () => {
        if (!confirm('Finalize settlement? This will lock in the P&L calculations.')) return;
        setSettling(true);
        try {
          const res = await fetch(`${API_URL}/staking/series/${seriesId}/settle`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ settlements: settlementData?.settlements || [] })
          });
          if (res.ok) { fetchSettlement(); fetchSeries(); }
        } catch {}
        setSettling(false);
      };

      const handleMarkPaid = async (settlementId, isPaid) => {
        try {
          await fetch(`${API_URL}/staking/settlements/${settlementId}/paid`, {
            method: 'PUT',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ isPaid: !isPaid })
          });
          fetchSettlement();
        } catch {}
      };

      if (!settlementData) {
        return <div style={{textAlign:'center',color:'var(--text-secondary)',padding:'30px 20px',fontSize:13}}>Loading settlement data…</div>;
      }

      const settlements = settlementData.settlements || [];

      if (settlements.length === 0) {
        return <div style={{textAlign:'center',color:'var(--text-secondary)',padding:'30px 20px',fontSize:13}}>No agreements to settle. Add agreements and log events first.</div>;
      }

      return (
        <div style={{padding:'12px 16px'}}>
          {settlements.map((s, i) => {
            const netPl = (s.gross_return || s.grossReturn || 0) - (s.gross_investment || s.grossInvestment || 0);
            const amtOwed = s.amount_owed || s.amountOwed || 0;
            return (
              <div key={s.backer_id || s.backerId || i} className="staking-settlement-card">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                  <div>
                    <div style={{fontWeight:600,fontSize:14}}>{s.backer_name || s.backerName || 'Backer'}</div>
                    <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{BACKER_TYPE_LABELS[s.backer_type || s.backerType] || s.backer_type || s.backerType || ''} · {s.percentage || 0}%</div>
                  </div>
                  {s.id && (
                    <label className="toggle-switch" style={{width:32,height:18}} title={s.is_paid ? 'Paid' : 'Unpaid'}>
                      <input type="checkbox" checked={!!s.is_paid} onChange={() => handleMarkPaid(s.id, s.is_paid)} />
                      <span className="toggle-slider" />
                    </label>
                  )}
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,marginTop:8,fontSize:12}}>
                  <div>Invested: <strong>{formatBuyin(s.gross_investment || s.grossInvestment || 0)}</strong></div>
                  <div>Returned: <strong>{formatBuyin(s.gross_return || s.grossReturn || 0)}</strong></div>
                  {(s.markup_amount || s.markupAmount) > 0 && <div>Markup: <strong>{formatBuyin(s.markup_amount || s.markupAmount || 0)}</strong></div>}
                  <div>Owed: <strong className={amtOwed >= 0 ? 'staking-pnl-pos' : 'staking-pnl-neg'}>{formatBuyin(Math.abs(amtOwed))}</strong></div>
                </div>
                <div style={{marginTop:6,fontSize:14,fontWeight:700}} className={netPl >= 0 ? 'staking-pnl-pos' : 'staking-pnl-neg'}>
                  {netPl >= 0 ? '+' : ''}{formatBuyin(netPl)} net
                </div>
                {s.is_paid && <div style={{fontSize:11,color:'#22c55e',marginTop:4}}>✓ Paid{s.paid_at ? ` · ${new Date(s.paid_at).toLocaleDateString()}` : ''}</div>}
              </div>
            );
          })}

          {!settlementData.isSettled && (
            <button
              className="create-group-submit"
              style={{fontSize:13,padding:'10px 20px',width:'100%',marginTop:12}}
              onClick={handleFinalize}
              disabled={settling}
            >
              {settling ? 'Finalizing…' : 'Finalize Settlement'}
            </button>
          )}
        </div>
      );
    }

    // ── Notifications Panel ─────────────────────────────────────
    function NotificationsPanel({ notifications, token, onClose, fetchNotifications, fetchShareBuddies, fetchMyGroups }) {
      const displayName = useDisplayName();
      const { groupInvites, buddyRequests, acceptedBuddies } = notifications;
      const isEmpty = groupInvites.length === 0 && buddyRequests.length === 0 && acceptedBuddies.length === 0;

      const handleAcceptGroupInvite = async (inviteId) => {
        try {
          const res = await fetch(`/api/group-invites/${inviteId}/accept`, {
            method: 'PUT',
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) {
            fetchNotifications();
            fetchMyGroups();
          }
        } catch {}
      };

      const handleDeclineGroupInvite = async (inviteId) => {
        try {
          const res = await fetch(`/api/group-invites/${inviteId}/decline`, {
            method: 'PUT',
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) fetchNotifications();
        } catch {}
      };

      const handleAcceptBuddy = async (requestId) => {
        try {
          const res = await fetch(`/api/share-request/${requestId}/accept`, {
            method: 'PUT',
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) {
            fetchNotifications();
            fetchShareBuddies();
          }
        } catch {}
      };

      const handleDeclineBuddy = async (requestId) => {
        try {
          const res = await fetch(`/api/share-request/${requestId}/reject`, {
            method: 'PUT',
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) {
            fetchNotifications();
            fetchShareBuddies();
          }
        } catch {}
      };

      const timeAgo = (dateStr) => {
        if (!dateStr) return '';
        const now = new Date();
        const d = new Date(dateStr);
        const diffMs = now - d;
        const mins = Math.floor(diffMs / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return `${mins}m ago`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}h ago`;
        const days = Math.floor(hrs / 24);
        return `${days}d ago`;
      };

      return ReactDOM.createPortal(
        React.createElement('div', null,
          React.createElement('div', { className: 'notif-backdrop', onClick: onClose }),
          React.createElement('div', { className: 'notif-panel' },
            React.createElement('div', { className: 'notif-panel-header' },
              React.createElement('span', { className: 'notif-panel-title' }, 'Notifications'),
              React.createElement('button', {
                className: 'btn btn-ghost btn-sm',
                onClick: onClose,
                style: { padding: '2px 6px', fontSize: '1.1rem', lineHeight: 1 }
              }, '×')
            ),
            isEmpty
              ? React.createElement('div', { className: 'notif-empty' },
                  React.createElement('div', { style: { width: 20, height: 20, margin: '0 auto 8px', color: 'var(--text-muted)' } },
                    React.createElement(Icon.check)
                  ),
                  'All caught up!'
                )
              : React.createElement('div', { className: 'notif-list' },
                  groupInvites.length > 0 && React.createElement('div', { className: 'notif-section' },
                    React.createElement('div', { className: 'notif-section-title' }, 'Group Invites'),
                    groupInvites.map(inv =>
                      React.createElement('div', { key: `gi-${inv.id}`, className: 'notif-item' },
                        React.createElement('div', { className: 'notif-item-content' },
                          React.createElement('div', { className: 'notif-item-text' },
                            React.createElement('strong', null, inv.invited_by_real_name || inv.invited_by_username),
                            ' invited you to ',
                            React.createElement('strong', null, inv.group_name)
                          ),
                          React.createElement('div', { className: 'notif-item-time' }, timeAgo(inv.created_at))
                        ),
                        React.createElement('div', { className: 'notif-item-actions' },
                          React.createElement('button', {
                            className: 'btn btn-primary btn-xs',
                            onClick: () => handleAcceptGroupInvite(inv.id)
                          }, 'Accept'),
                          React.createElement('button', {
                            className: 'btn btn-ghost btn-xs',
                            onClick: () => handleDeclineGroupInvite(inv.id)
                          }, 'Decline')
                        )
                      )
                    )
                  ),
                  buddyRequests.length > 0 && React.createElement('div', { className: 'notif-section' },
                    React.createElement('div', { className: 'notif-section-title' }, 'Connection Requests'),
                    buddyRequests.map(req =>
                      React.createElement('div', { key: `br-${req.id}`, className: 'notif-item' },
                        React.createElement('div', { className: 'notif-item-content' },
                          React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '6px' } },
                            React.createElement(Avatar, { src: req.avatar, username: req.username, size: 24 }),
                            React.createElement('div', { className: 'notif-item-text' },
                              React.createElement('strong', null, displayName(req)),
                              ' wants to connect'
                            )
                          ),
                          React.createElement('div', { className: 'notif-item-time' }, timeAgo(req.created_at))
                        ),
                        React.createElement('div', { className: 'notif-item-actions' },
                          React.createElement('button', {
                            className: 'btn btn-primary btn-xs',
                            onClick: () => handleAcceptBuddy(req.id)
                          }, 'Accept'),
                          React.createElement('button', {
                            className: 'btn btn-ghost btn-xs',
                            onClick: () => handleDeclineBuddy(req.id)
                          }, 'Decline')
                        )
                      )
                    )
                  ),
                  acceptedBuddies.length > 0 && React.createElement('div', { className: 'notif-section' },
                    React.createElement('div', { className: 'notif-section-title' }, 'Recent Activity'),
                    acceptedBuddies.map(ab =>
                      React.createElement('div', { key: `ab-${ab.id}`, className: 'notif-item notif-item-info' },
                        React.createElement('div', { className: 'notif-item-content' },
                          React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '6px' } },
                            React.createElement(Avatar, { src: ab.avatar, username: ab.username, size: 24 }),
                            React.createElement('div', { className: 'notif-item-text' },
                              React.createElement('strong', null, displayName(ab)),
                              ' accepted your request'
                            )
                          ),
                          React.createElement('div', { className: 'notif-item-time' }, timeAgo(ab.responded_at))
                        )
                      )
                    )
                  )
                )
          )
        ),
        document.body
      );
    }

    // ── Placeholder: Social View ─────────────────────────────────
    function SocialView({
      shareBuddies, buddyLiveUpdates, displayName, myGroups, activeGroupId, setActiveGroupId,
      groupFeed, groupSchedule, fetchGroupFeed, fetchGroupSchedule, fetchMyGroups,
      token, onRemoveBuddy, onNavigate
    }) {
      const [expandedId, setExpandedId] = useState(null);
      const [showCreateGroup, setShowCreateGroup] = useState(false);
      const [buddySchedules, setBuddySchedules] = useState({});
      const [loadingSchedule, setLoadingSchedule] = useState(null);
      const [addToGroupBuddyId, setAddToGroupBuddyId] = useState(null);
      const [confirmRemoveId, setConfirmRemoveId] = useState(null);
      const [inviteStatus, setInviteStatus] = useState({}); // { buddyId: { groupId: 'sent' | 'error' | 'member' } }

      const handleInviteToGroup = async (buddyId, groupId, username) => {
        try {
          const res = await fetch(`${API_URL}/groups/${groupId}/members`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ username })
          });
          if (res.ok) {
            setInviteStatus(prev => ({ ...prev, [buddyId]: { ...prev[buddyId], [groupId]: 'sent' } }));
          } else {
            const data = await res.json();
            if (data.error && /already/i.test(data.error)) {
              setInviteStatus(prev => ({ ...prev, [buddyId]: { ...prev[buddyId], [groupId]: 'member' } }));
            } else {
              setInviteStatus(prev => ({ ...prev, [buddyId]: { ...prev[buddyId], [groupId]: 'error' } }));
            }
          }
        } catch {
          setInviteStatus(prev => ({ ...prev, [buddyId]: { ...prev[buddyId], [groupId]: 'error' } }));
        }
      };

      const toggleBuddy = (buddyId) => {
        if (expandedId === buddyId) { setExpandedId(null); return; }
        setExpandedId(buddyId);
        if (!buddySchedules[buddyId]) {
          setLoadingSchedule(buddyId);
          fetch(`${API_URL}/schedule/${buddyId}`, {
            headers: { Authorization: `Bearer ${token}` }
          })
            .then(r => r.json())
            .then(data => {
              setBuddySchedules(prev => ({ ...prev, [buddyId]: Array.isArray(data) ? data : [] }));
              setLoadingSchedule(null);
            })
            .catch(() => {
              setBuddySchedules(prev => ({ ...prev, [buddyId]: [] }));
              setLoadingSchedule(null);
            });
        }
      };

      // If a group is active, show GroupDetailView
      if (activeGroupId) {
        const group = myGroups.find(g => g.id === activeGroupId);
        return (
          <GroupDetailView
            group={group}
            groupFeed={groupFeed}
            groupSchedule={groupSchedule}
            fetchGroupFeed={fetchGroupFeed}
            fetchGroupSchedule={fetchGroupSchedule}
            fetchMyGroups={fetchMyGroups}
            shareBuddies={shareBuddies}
            buddyLiveUpdates={buddyLiveUpdates}
            displayName={displayName}
            token={token}
            onBack={() => { setActiveGroupId(null); setExpandedId(null); }}
          />
        );
      }

      const hasBuddies = shareBuddies && shareBuddies.length > 0;
      const hasGroups = myGroups && myGroups.length > 0;

      if (!hasBuddies && !hasGroups) {
        return (
          <div className="placeholder-view">
            <Icon.people />
            <h2>Social</h2>
            <p>
              No connections yet.{' '}
              <button onClick={() => onNavigate('settings')} style={{background:'none',border:'none',color:'var(--accent)',cursor:'pointer',fontFamily:'inherit',fontSize:'inherit',textDecoration:'underline',padding:0}}>
                Add friends
              </button>{' '}
              to see their live updates here.
            </p>
          </div>
        );
      }

      const timeAgo = (ts) => {
        if (!ts) return '';
        const diff = (Date.now() - new Date(ts).getTime()) / 1000;
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        return Math.floor(diff / 86400) + 'd ago';
      };

      return (
        <div className="social-view">
          {/* ── Groups section ── */}
          <div className="dashboard-section-header" style={{marginBottom:'8px'}}>
            <div className="dashboard-section-title">Groups</div>
            {hasBuddies && (
              <button
                className="dashboard-section-badge"
                style={{cursor:'pointer',background:'var(--accent)',color:'#fff',border:'none',borderRadius:12,padding:'2px 10px',fontSize:12,fontWeight:700}}
                onClick={() => setShowCreateGroup(true)}
              >+ New</button>
            )}
          </div>

          {hasGroups ? myGroups.map(g => (
            <button
              key={g.id}
              className="social-group-card"
              onClick={() => {
                setActiveGroupId(g.id);
                fetchGroupFeed(g.id);
              }}
            >
              <div className="social-buddy-row">
                <div className="social-group-avatar">{g.name.charAt(0).toUpperCase()}</div>
                <div className="social-buddy-info">
                  <div className="social-buddy-name">{g.name}</div>
                  <div className="social-group-meta">
                    {g.member_count} member{g.member_count !== 1 ? 's' : ''}{g.owner_name ? ` · Owner: ${g.owner_name}` : ''}
                    {g.last_message && (
                      <span> · {g.last_message_by}: "{g.last_message.length > 25 ? g.last_message.slice(0, 25) + '…' : g.last_message}" {timeAgo(g.last_message_at)}</span>
                    )}
                  </div>
                </div>
                <span style={{marginLeft:'auto',color:'var(--text-secondary)',fontSize:18}}>›</span>
              </div>
            </button>
          )) : (
            <div style={{color:'var(--text-secondary)',fontSize:13,padding:'8px 0 16px'}}>
              {hasBuddies ? 'No groups yet. Create one to share schedules and chat with friends.' : 'Add connections first to create groups.'}
            </div>
          )}

          {/* ── Connections section ── */}
          {hasBuddies && (
            <React.Fragment>
              <div className="dashboard-section-header" style={{marginBottom:'8px',marginTop:12}}>
                <div className="dashboard-section-title">Connections</div>
                <span className="dashboard-section-badge">{shareBuddies.length} friend{shareBuddies.length !== 1 ? 's' : ''}</span>
              </div>
              {shareBuddies.map(buddy => {
                const lu = buddyLiveUpdates?.[buddy.id];
                const isLive = lu && !lu.isBusted;
                const isExpanded = expandedId === buddy.id;
                return (
                  <div
                    key={buddy.id}
                    className={`social-buddy-card${isLive ? ' live' : ''}`}
                  >
                    <div className="social-buddy-row" onClick={() => toggleBuddy(buddy.id)} style={{cursor:'pointer'}}>
                      <Avatar src={buddy.avatar} username={buddy.username} size={36} />
                      <div className="social-buddy-info">
                        <div className="social-buddy-name">{displayName(buddy)}</div>
                        {isLive ? (
                          <div className="social-buddy-status live">
                            <span className="social-live-dot" />
                            {getVenueInfo(lu.venue).abbr} | {lu.eventName}
                          </div>
                        ) : lu?.isBusted ? (
                          <div className="social-buddy-status busted">Busted</div>
                        ) : (
                          <div className="social-buddy-status idle">
                            {buddySchedules[buddy.id] ? `${buddySchedules[buddy.id].length} event${buddySchedules[buddy.id].length !== 1 ? 's' : ''} scheduled` : 'View schedule'}
                          </div>
                        )}
                      </div>
                      <span style={{marginLeft:'auto',color:'var(--text-muted)',fontSize:'0.7rem',transition:'transform 0.15s',transform: isExpanded ? 'rotate(180deg)' : 'rotate(0deg)'}}>▼</span>
                    </div>
                    {isExpanded && isLive && (
                      <div className="social-buddy-detail">
                        <div className="social-detail-row">
                          <span className="social-detail-label">Stack</span>
                          <span className="social-detail-value">{lu.stack ? Number(lu.stack).toLocaleString() : '—'}</span>
                        </div>
                        {lu.bb && (
                          <div className="social-detail-row">
                            <span className="social-detail-label">Blinds</span>
                            <span className="social-detail-value">
                              {lu.sb ? Number(lu.sb).toLocaleString() : '?'}/{Number(lu.bb).toLocaleString()}
                              {(lu.bbAnte || lu.bb_ante) ? '/' + Number(lu.bbAnte || lu.bb_ante).toLocaleString() : ''}
                            </span>
                          </div>
                        )}
                        {lu.bb && lu.stack && (
                          <div className="social-detail-row">
                            <span className="social-detail-label">BB</span>
                            <span className="social-detail-value">{(Number(lu.stack) / Number(lu.bb)).toFixed(1).replace(/\.0$/, '')}bb</span>
                          </div>
                        )}
                        {(lu.isItm || lu.is_itm) && (
                          <div className="social-detail-row">
                            <span className="social-detail-label">Status</span>
                            <span className="social-detail-value" style={{color:'#22c55e'}}>In the Money</span>
                          </div>
                        )}
                        {(lu.isFinalTable || lu.is_final_table) && (
                          <div className="social-detail-row">
                            <span className="social-detail-label">Final Table</span>
                            <span className="social-detail-value" style={{color:'#f59e0b'}}>
                              {(lu.placesLeft || lu.places_left) ? (lu.placesLeft || lu.places_left) + ' left' : 'Yes'}
                            </span>
                          </div>
                        )}
                        <div className="social-detail-row">
                          <span className="social-detail-label">Venue</span>
                          <span className="social-detail-value">{lu.venue || '—'}</span>
                        </div>
                      </div>
                    )}
                    {isExpanded && (() => {
                      const sched = buddySchedules[buddy.id];
                      const todayISO = getToday();
                      if (loadingSchedule === buddy.id) {
                        return <div style={{padding:'12px',fontSize:'0.8rem',color:'var(--text-muted)'}}>Loading schedule...</div>;
                      }
                      if (!sched || sched.length === 0) {
                        return <div style={{padding:'12px',fontSize:'0.8rem',color:'var(--text-muted)'}}>No events scheduled</div>;
                      }
                      const upcoming = sched.filter(t => normaliseDate(t.date) >= todayISO).sort((a, b) => {
                        const da = new Date(`${a.date} ${(a.time && a.time !== 'TBD') ? a.time : '12:00 AM'}`);
                        const db = new Date(`${b.date} ${(b.time && b.time !== 'TBD') ? b.time : '12:00 AM'}`);
                        return da - db;
                      });
                      if (upcoming.length === 0) {
                        return <div style={{padding:'12px',fontSize:'0.8rem',color:'var(--text-muted)'}}>No upcoming events</div>;
                      }
                      // Group by date
                      const groups = [];
                      let cur = null;
                      for (const t of upcoming) {
                        const d = normaliseDate(t.date);
                        if (!cur || cur.date !== d) { cur = { date: d, events: [] }; groups.push(cur); }
                        cur.events.push(t);
                      }
                      return (
                        <div style={{borderTop:'1px solid var(--border)',marginTop:'4px',paddingTop:'4px'}}>
                          <div style={{padding:'6px 12px 4px',fontSize:'0.72rem',fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.05em',fontFamily:'Oswald, sans-serif'}}>
                            Upcoming Schedule ({upcoming.length} event{upcoming.length !== 1 ? 's' : ''})
                          </div>
                          <div style={{display:'grid',gridTemplateColumns:'auto auto auto auto 1fr auto',gap:'0 6px',padding:'0 12px',fontSize:'0.8rem',alignItems:'center'}}>
                          {groups.map(group => {
                            const dateObj = new Date(group.date + 'T12:00:00');
                            const dayAbbr = group.date === todayISO ? '' : ['Su','M','Tu','W','Th','F','Sa'][dateObj.getDay()];
                            const dateLabel = group.date === todayISO ? 'Today' :
                              ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dateObj.getMonth()] + ' ' + dateObj.getDate();
                            return (
                              <React.Fragment key={group.date}>
                                {group.events.map((t, i) => {
                                  const v = getVenueInfo(t.venue);
                                  return (
                                    <React.Fragment key={t.id}>
                                      <span style={{fontSize:'0.72rem',fontWeight:700,color:'var(--text-muted)',fontFamily:"'Libre Baskerville', Georgia, serif",whiteSpace:'nowrap',padding:'4px 0'}}>{i === 0 ? dayAbbr : ''}</span>
                                      <span style={{fontSize:'0.72rem',fontWeight:700,color:'var(--text)',fontFamily:"'Libre Baskerville', Georgia, serif",whiteSpace:'nowrap',padding:'4px 0'}}>{i === 0 ? dateLabel : ''}</span>
                                      <span style={{color: getVenueBrandColor(v.abbr),fontWeight:600,fontSize:'0.65rem',whiteSpace:'nowrap',textAlign:'center'}}>{v.abbr}</span>
                                      <span style={{color:'var(--text-muted)',fontSize:'0.72rem',whiteSpace:'nowrap'}}>{t.time || 'TBD'}</span>
                                      <span style={{color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',minWidth:0}}>{t.event_name}</span>
                                      <span style={{color:'var(--text-muted)',fontSize:'0.72rem',fontWeight:600,whiteSpace:'nowrap',textAlign:'right'}}>{formatBuyin(t.buyin)}</span>
                                    </React.Fragment>
                                  );
                                })}
                              </React.Fragment>
                            );
                          })}
                          </div>
                        </div>
                      );
                    })()}
                    {isExpanded && (
                      <div style={{borderTop:'1px solid var(--border)',marginTop:'4px',padding:'8px 12px',display:'flex',flexDirection:'column',gap:'6px'}}>
                        {myGroups && myGroups.length > 0 && (
                          addToGroupBuddyId === buddy.id ? (
                            <div>
                              <div style={{fontSize:'0.72rem',fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.05em',fontFamily:'Oswald, sans-serif',marginBottom:'6px'}}>
                                Add to Group
                              </div>
                              {myGroups.map(g => {
                                const status = inviteStatus[buddy.id]?.[g.id];
                                return (
                                  <button
                                    key={g.id}
                                    disabled={!!status}
                                    onClick={(e) => { e.stopPropagation(); handleInviteToGroup(buddy.id, g.id, buddy.username); }}
                                    style={{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',
                                      padding:'6px 8px',background:'none',border:'1px solid var(--border)',borderRadius:'6px',
                                      color:'var(--text)',cursor: status ? 'default' : 'pointer',fontSize:'0.8rem',marginBottom:'4px',
                                      opacity: status ? 0.6 : 1}}
                                  >
                                    <span>{g.name}</span>
                                    <span style={{fontSize:'0.72rem',color: status === 'sent' ? '#22c55e' : status === 'member' ? 'var(--text-muted)' : status === 'error' ? '#ef4444' : 'var(--accent)'}}>
                                      {status === 'sent' ? 'Invited' : status === 'member' ? 'Already in group' : status === 'error' ? 'Failed' : 'Invite'}
                                    </span>
                                  </button>
                                );
                              })}
                              <button
                                onClick={(e) => { e.stopPropagation(); setAddToGroupBuddyId(null); }}
                                style={{background:'none',border:'none',color:'var(--text-muted)',cursor:'pointer',fontSize:'0.75rem',marginTop:'4px',padding:0}}
                              >Cancel</button>
                            </div>
                          ) : (
                            <button
                              onClick={(e) => { e.stopPropagation(); setAddToGroupBuddyId(buddy.id); }}
                              style={{background:'none',border:'1px solid var(--border)',borderRadius:'6px',
                                color:'var(--text)',cursor:'pointer',fontSize:'0.8rem',padding:'6px 12px',width:'100%',
                                fontFamily:'Oswald, sans-serif'}}
                            >+ Add to Group</button>
                          )
                        )}
                        {confirmRemoveId === buddy.id ? (
                          <div style={{display:'flex',alignItems:'center',gap:'8px',justifyContent:'space-between'}}>
                            <span style={{fontSize:'0.75rem',color:'#ef4444'}}>Remove {displayName(buddy)}?</span>
                            <div style={{display:'flex',gap:'6px'}}>
                              <button
                                onClick={(e) => { e.stopPropagation(); setConfirmRemoveId(null); }}
                                style={{background:'none',border:'1px solid var(--border)',borderRadius:'6px',
                                  color:'var(--text-muted)',cursor:'pointer',fontSize:'0.75rem',padding:'4px 10px'}}
                              >Cancel</button>
                              <button
                                onClick={(e) => { e.stopPropagation(); onRemoveBuddy(buddy.id); setConfirmRemoveId(null); setExpandedId(null); }}
                                style={{background:'#b91c1c',border:'none',borderRadius:'6px',
                                  color:'#fff',cursor:'pointer',fontSize:'0.75rem',padding:'4px 10px',fontWeight:600}}
                              >Remove</button>
                            </div>
                          </div>
                        ) : (
                          <button
                            onClick={(e) => { e.stopPropagation(); setConfirmRemoveId(buddy.id); }}
                            style={{background:'none',border:'1px solid var(--border)',borderRadius:'6px',
                              color:'#b91c1c',cursor:'pointer',fontSize:'0.8rem',padding:'6px 12px',width:'100%',
                              fontFamily:'Oswald, sans-serif'}}
                          >Remove Connection</button>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </React.Fragment>
          )}

          {/* ── Create Group Modal ── */}
          {showCreateGroup && ReactDOM.createPortal(
            <CreateGroupModal
              shareBuddies={shareBuddies}
              displayName={displayName}
              token={token}
              onClose={() => setShowCreateGroup(false)}
              onCreated={() => { setShowCreateGroup(false); fetchMyGroups(); }}
            />,
            document.body
          )}
        </div>
      );
    }

    // ── Create Group Modal ──────────────────────────────────────
    function CreateGroupModal({ shareBuddies, displayName, token, onClose, onCreated }) {
      const [name, setName] = useState('');
      const [selected, setSelected] = useState(new Set());
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleCreate = async () => {
        if (!name.trim()) { setError('Group name is required'); return; }
        setLoading(true);
        setError('');
        try {
          const createRes = await fetch(`${API_URL}/groups`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name.trim() })
          });
          if (!createRes.ok) {
            const d = await createRes.json();
            setError(d.error || 'Failed to create group');
            setLoading(false);
            return;
          }
          const { id: groupId } = await createRes.json();

          // Send invites to selected buddies
          let inviteCount = 0;
          for (const buddy of shareBuddies) {
            if (selected.has(buddy.id)) {
              const invRes = await fetch(`${API_URL}/groups/${groupId}/members`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: buddy.username })
              });
              if (invRes.ok) inviteCount++;
            }
          }

          onCreated(inviteCount);
        } catch {
          setError('Something went wrong');
        }
        setLoading(false);
      };

      const toggleBuddy = (id) => {
        setSelected(prev => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      };

      return (
        <div className="create-group-modal" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="create-group-panel">
            <div className="create-group-header">
              <h3 style={{margin:0,fontFamily:'Oswald, sans-serif',textTransform:'uppercase',letterSpacing:1}}>Create Group</h3>
              <button onClick={onClose} style={{background:'none',border:'none',color:'var(--text)',fontSize:20,cursor:'pointer',padding:4}}>✕</button>
            </div>

            <label className="create-group-label">Group Name</label>
            <input
              className="create-group-input"
              value={name}
              onChange={e => setName(e.target.value)}
              placeholder="e.g. Vegas Crew"
              maxLength={40}
              autoFocus
            />

            {shareBuddies.length > 0 && (
              <React.Fragment>
                <label className="create-group-label" style={{marginTop:12}}>Add Members</label>
                <div className="create-group-buddies">
                  {shareBuddies.map(b => (
                    <button
                      key={b.id}
                      className={`create-group-buddy-btn${selected.has(b.id) ? ' selected' : ''}`}
                      onClick={() => toggleBuddy(b.id)}
                    >
                      <Avatar src={b.avatar} username={b.username} size={24} />
                      <span>{displayName(b)}</span>
                      {selected.has(b.id) && <span style={{marginLeft:'auto',color:'var(--accent)'}}>✓</span>}
                    </button>
                  ))}
                </div>
              </React.Fragment>
            )}

            {error && <div style={{color:'#ef4444',fontSize:13,marginTop:8}}>{error}</div>}

            <button
              className="create-group-submit"
              onClick={handleCreate}
              disabled={loading || !name.trim()}
            >
              {loading ? 'Creating…' : 'Create Group'}
            </button>
          </div>
        </div>
      );
    }

    // ── Group Detail View ───────────────────────────────────────
    function GroupDetailView({
      group, groupFeed, groupSchedule, fetchGroupFeed, fetchGroupSchedule,
      fetchMyGroups, shareBuddies, buddyLiveUpdates, displayName, token, onBack
    }) {
      const [segment, setSegment] = useState('feed');
      const [members, setMembers] = useState([]);
      const [msgText, setMsgText] = useState('');
      const [sending, setSending] = useState(false);
      const [showAddMember, setShowAddMember] = useState(false);
      const [pendingInvites, setPendingInvites] = useState([]);
      const [leaderboardData, setLeaderboardData] = useState([]);
      const feedEndRef = React.useRef(null);

      const groupId = group?.id;

      // Fetch members + pending invites when component mounts or group changes
      useEffect(() => {
        if (!groupId) return;
        fetchGroupFeed(groupId);
        fetchMembers();
        fetchPendingInvites();
      }, [groupId]);

      // Scroll feed to bottom when new messages arrive
      useEffect(() => {
        if (segment === 'feed' && feedEndRef.current) {
          feedEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [groupFeed, segment]);

      // Fetch schedule when switching to schedule tab
      useEffect(() => {
        if (segment === 'schedule' && groupId) {
          fetchGroupSchedule(groupId);
        }
      }, [segment, groupId]);

      // Fetch leaderboard when switching to leaderboard tab
      useEffect(() => {
        if (segment === 'leaderboard' && groupId && group.leaderboard_enabled) {
          fetchLeaderboard();
        }
      }, [segment, groupId]);

      const fetchMembers = async () => {
        try {
          const res = await fetch(`${API_URL}/groups/${groupId}/members`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) setMembers(await res.json());
        } catch {}
      };

      const fetchPendingInvites = async () => {
        try {
          const res = await fetch(`${API_URL}/groups/${groupId}/invites`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setPendingInvites(Array.isArray(data) ? data : []);
          }
        } catch {}
      };

      const fetchLeaderboard = async () => {
        try {
          const res = await fetch(`${API_URL}/groups/${groupId}/leaderboard`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) setLeaderboardData(await res.json());
        } catch {}
      };

      const toggleLeaderboard = async (enabled) => {
        try {
          const res = await fetch(`${API_URL}/groups/${groupId}/leaderboard`, {
            method: 'PUT',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled })
          });
          if (res.ok) fetchMyGroups();
        } catch {}
      };

      const handleSend = async () => {
        if (!msgText.trim() || sending) return;
        setSending(true);
        try {
          await fetch(`${API_URL}/groups/${groupId}/messages`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msgText.trim() })
          });
          setMsgText('');
          fetchGroupFeed(groupId);
        } catch {}
        setSending(false);
      };

      const handleDeleteGroup = async () => {
        if (!confirm('Delete this group? This cannot be undone.')) return;
        try {
          await fetch(`${API_URL}/groups/${groupId}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` }
          });
          fetchMyGroups();
          onBack();
        } catch {}
      };

      const handleLeaveGroup = async () => {
        if (!confirm('Leave this group?')) return;
        try {
          // Need to know our own user ID — extract from token
          const payload = JSON.parse(atob(token.split('.')[1]));
          await fetch(`${API_URL}/groups/${groupId}/members/${payload.id}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` }
          });
          fetchMyGroups();
          onBack();
        } catch {}
      };

      const handleAddMember = async (buddy) => {
        try {
          const res = await fetch(`${API_URL}/groups/${groupId}/members`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: buddy.username })
          });
          if (res.ok) {
            setShowAddMember(false);
            fetchMyGroups();
            fetchPendingInvites();
          }
        } catch {}
      };

      const handleRemoveMember = async (userId) => {
        if (!confirm('Remove this member from the group?')) return;
        try {
          await fetch(`${API_URL}/groups/${groupId}/members/${userId}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` }
          });
          fetchMyGroups();
          fetchMembers();
        } catch {}
      };

      if (!group) return <div className="placeholder-view"><p>Group not found</p><button onClick={onBack}>Back</button></div>;

      const isOwner = group.my_role === 'owner';

      const timeAgo = (ts) => {
        if (!ts) return '';
        const diff = (Date.now() - new Date(ts).getTime()) / 1000;
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h';
        return Math.floor(diff / 86400) + 'd';
      };

      return (
        <div className="group-detail-view">
          {/* Header */}
          <div className="group-detail-header">
            <button className="group-back-btn" onClick={onBack}>←</button>
            <div style={{flex:1}}>
              <div className="social-buddy-name" style={{fontSize:16}}>{group.name}</div>
              <div style={{fontSize:12,color:'var(--text-secondary)'}}>{group.member_count} member{group.member_count !== 1 ? 's' : ''}{group.owner_name ? ` · Owner: ${group.owner_name}` : ''}</div>
            </div>
            {isOwner ? (
              <button onClick={handleDeleteGroup} style={{background:'none',border:'none',color:'var(--text-secondary)',fontSize:13,cursor:'pointer'}}>Delete</button>
            ) : (
              <button onClick={handleLeaveGroup} style={{background:'none',border:'none',color:'var(--text-secondary)',fontSize:13,cursor:'pointer'}}>Leave</button>
            )}
          </div>

          {/* Segment tabs */}
          <div className="group-segments">
            {(() => {
              const segs = ['feed', 'schedule'];
              if (group.leaderboard_enabled) segs.push('leaderboard');
              segs.push('members');
              return segs;
            })().map(s => (
              <button
                key={s}
                className={`group-segment-btn${segment === s ? ' active' : ''}`}
                onClick={() => setSegment(s)}
              >
                {s === 'feed' ? 'Live Feed' : s === 'schedule' ? 'Schedule' : s === 'leaderboard' ? 'Leaderboard' : 'Members'}
              </button>
            ))}
          </div>

          {/* Feed tab */}
          {segment === 'feed' && (
            <div className="group-feed-container">
              <div className="group-feed">
                {groupFeed.length === 0 ? (
                  <div style={{textAlign:'center',color:'var(--text-secondary)',padding:'40px 20px',fontSize:13}}>
                    No messages yet. Say something!
                  </div>
                ) : groupFeed.map((item, i) => (
                  <div key={item.id || i} className={`group-feed-item ${item.type}`}>
                    <Avatar src={item.avatar} username={item.username || '?'} size={28} />
                    <div className="group-feed-item-body">
                      <div className="group-feed-item-header">
                        <span className="group-feed-item-name">{displayName(item)}</span>
                        <span className="group-feed-item-time">{timeAgo(item.created_at)}</span>
                      </div>
                      {item.type === 'message' ? (
                        <div className="group-feed-item-text">{item.content}</div>
                      ) : item.type === 'live-update' && item.liveData ? (
                        <div className="group-feed-item-text" style={{color:'var(--accent)',fontSize:12}}>
                          ♠ {item.liveData.eventName || 'Tournament'} — {formatLiveUpdate(item.liveData)}
                        </div>
                      ) : (
                        <div className="group-feed-item-text">{item.content}</div>
                      )}
                    </div>
                  </div>
                ))}
                <div ref={feedEndRef} />
              </div>
              <div className="group-feed-input">
                <input
                  value={msgText}
                  onChange={e => setMsgText(e.target.value)}
                  placeholder="Type a message…"
                  maxLength={500}
                  onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
                />
                <button onClick={handleSend} disabled={sending || !msgText.trim()}>Send</button>
              </div>
            </div>
          )}

          {/* Schedule tab */}
          {segment === 'schedule' && (
            <div className="group-schedule">
              {groupSchedule.length === 0 ? (
                <div style={{textAlign:'center',color:'var(--text-secondary)',padding:'40px 20px',fontSize:13}}>
                  No members have scheduled any tournaments yet.
                </div>
              ) : groupSchedule.map(t => (
                <div key={t.id} className="group-schedule-card">
                  <div className="group-schedule-card-top">
                    <div>
                      <div style={{fontWeight:600,fontSize:14}}>{t.event_name}</div>
                      <div style={{fontSize:12,color:'var(--text-secondary)'}}>{t.date} · {t.time} · ${Number(t.buyin).toLocaleString()}</div>
                    </div>
                    <div style={{fontSize:11,color:'var(--text-secondary)'}}>{getVenueInfo(t.venue).abbr}</div>
                  </div>
                  <div className="group-schedule-members">
                    {t.members.map(m => (
