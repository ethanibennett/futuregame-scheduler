<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <title>futurega.me | spring/summer 2026</title>
  <script>
    // Set theme + contrast before React mounts to prevent flash of wrong theme
    (function() {
      var t = localStorage.getItem('theme') || 'dark';
      var c = localStorage.getItem('contrast') || 'normal';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-contrast', c);
      var meta = document.querySelector('meta[name="theme-color"]');
      var mc = {dark:'#111111',dusk:'#0d1525',light:'#f5f5f5',cloudy:'#cbcbcb'};
      if (meta) meta.setAttribute('content', mc[t] || '#111111');
    })();
    // Platform detection — sets data-platform attribute for CSS targeting
    (function() {
      var platform = 'web';
      if (window.Capacitor && window.Capacitor.getPlatform) {
        platform = window.Capacitor.getPlatform(); // 'ios' | 'android' | 'web'
      } else {
        var ua = navigator.userAgent || '';
        if (/iPad|iPhone|iPod/.test(ua)) platform = 'ios-web';
        else if (/Android/i.test(ua)) platform = 'android-web';
      }
      document.documentElement.setAttribute('data-platform', platform);
      var isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
      if (isStandalone) document.documentElement.setAttribute('data-standalone', 'true');
    })();
  </script>
  <style>
    /* Critical layout — inlined to bypass PWA cache */
    html, body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; margin: 0; padding: 0; background: var(--surface); }
    /* The bottom inset is reserved EXACTLY ONCE, inside .bottom-nav, which is
       the only thing that sits against the home indicator. It used to be
       reserved twice — .app-shell padded its bottom by the inset here, the nav
       padded its own, and #root was pulled below the screen by the same amount
       to cancel the first one out. On device that cancellation did not hold:
       measured on an iPhone 16 Pro screenshot (1206x2622 at 3x), the nav's
       gradient ended 34pt above the screen edge with the shell's padding
       showing --surface beneath it, which is the gap that was reported.
       #root ends at the screen edge and the shell pads only the top. */
    #root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
    .app-shell {
      padding-top: env(safe-area-inset-top, 0px) !important;
    }
    @media screen and (display-mode: standalone) {
      .app-shell { padding-top: max(env(safe-area-inset-top, 0px), 47px) !important; }
    }
    /* The splash never moved, which reads as a frozen screenshot. One entrance,
       staggered, so the (now much shorter) dwell is earned. Honours reduced
       motion — this block cannot use the duration tokens because it paints
       before the stylesheet's :root is applied. */
    @keyframes splashRise {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
    }
    #splash img { animation: splashRise 0.5s cubic-bezier(0.22,1,0.36,1) both; }
    #splash h1  { animation: splashRise 0.5s cubic-bezier(0.22,1,0.36,1) 0.08s both; }
    #splash p   { animation: splashRise 0.5s cubic-bezier(0.22,1,0.36,1) 0.14s both; }
    @media (prefers-reduced-motion: reduce) {
      #splash img, #splash h1, #splash p { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" style="position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity 0.32s cubic-bezier(0.22,1,0.36,1);">
    <img src="/splash-icon.svg" alt="" style="width:80px;height:80px;margin-bottom:20px;" />
    <!-- -0.05em matches --track-wordmark, and the stack mirrors --serif. This is
         the only wordmark that can read neither (it paints before the stylesheet
         loads), so both have to be kept in step by hand. They disagreed until
         now: the wordmark visibly re-tracked at the moment the splash
         cross-faded into the app, and with the CDN unreachable the FIRST frame
         fell to Georgia while every screen after it degraded to a real
         Baskerville. -->
    <h1 style="font-family:'Libre Baskerville','Baskerville MT Std',Georgia,serif;font-size:1.6rem;color:var(--text);letter-spacing:-0.05em;margin:0;">futurega.me</h1>
    <p id="splash-season" style="font-family:'Univers Condensed','Univers',sans-serif;font-size:0.8rem;color:var(--text-muted);margin-top:4px;">spring/summer 2026</p>
  </div>
  <script>
    // Match the splash subtitle and the tab title to the in-app header, which
    // labels the span the upcoming events actually cover. App.jsx writes that
    // label here after each load; the markup above and the <title> keep the
    // static wording as the first-run fallback. Runs during parse, so neither
    // static string paints. App.jsx retitles again once the feed lands, which
    // is what corrects a first-ever load.
    (function() {
      var label = localStorage.getItem('seasonLabel');
      if (!label) return;
      var el = document.getElementById('splash-season');
      if (el) el.textContent = label;
      document.title = 'futurega.me | ' + label;
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Fade out splash once React renders
    (function() {
      var splash = document.getElementById('splash');
      if (!splash) return;
      var obs = new MutationObserver(function() {
        if (document.getElementById('root').children.length > 0) {
          obs.disconnect();
          // Was 1500ms of dwell plus a 400ms fade plus a 400ms removal — 1.9
          // seconds of stillness AFTER the app was already ready, on a splash
          // with no motion of its own, which reads as slowness rather than
          // polish. The entrance below earns the remaining 250ms.
          setTimeout(function() {
            splash.style.opacity = '0';
            setTimeout(function() { splash.remove(); }, 320);
          }, 250);
        }
      });
      obs.observe(document.getElementById('root'), { childList: true });
      setTimeout(function() {
        if (splash.parentNode) {
          splash.style.opacity = '0';
          setTimeout(function() { splash.remove(); }, 400);
        }
      }, 3000);
    })();
  </script>
</body>
</html>
