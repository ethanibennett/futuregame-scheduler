name: iOS TestFlight

# Real-time app builds on the Mac, triggered by GitHub rather than by a human
# remembering to run something. Requires a self-hosted runner on the Mac (see
# docs/mac-build.md); GitHub-hosted macOS runners can't be used because signing
# needs the App Store Connect key that lives on that machine.
#
# IMPORTANT — this is NOT how tournament data reaches the app. The installed app
# fetches events live from https://futurega.me/api and refetches on the SSE
# `schedule-refetch` broadcast, so new events from the MTT feed appear within
# seconds without any build. Only changes to the BUNDLED web assets (vite-app/)
# or the native project need a new TestFlight build, which is exactly what the
# path filter below matches. Rebuilding on every feed ingest would ship an
# hourly build that changes nothing a user can see.

on:
  # A push to master that changes what the app actually bundles.
  push:
    branches: [master]
    paths:
      - 'vite-app/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'build.js'
      - 'scripts/ios-testflight.sh'
  # Manual, from the Actions tab.
  workflow_dispatch:
  # Programmatic, so the Windows box (or anything else) can decide when to ship:
  #   gh api repos/ethanibennett/futuregame-scheduler/dispatches \
  #     -f event_type=ios-testflight
  repository_dispatch:
    types: [ios-testflight]

# Several merges in quick succession still collapse into one build — but by
# superseding each other in the group's pending slot, not by shooting whatever
# is already in flight. `cancel-in-progress: true` did the latter, and against a
# Mac that is usually asleep that meant the next merge killed the build waiting
# for it. Both halves are observed in this repo's own history: run 31774333122
# was cancelled with `runner_name` empty and `started_at == created_at` — never
# assigned to a runner, killed while still queued — at the exact second the
# following run was created; run 31774443175 was cancelled 34 seconds into a
# live archive on the Mac.
#
# With `cancel-in-progress: false`, a run already admitted to the group is left
# alone — including one merely waiting for the offline runner, which holds the
# active slot and not the pending one (31774333122 held it, and the run that
# replaced it was picked up by the runner 78 seconds later). Later triggers
# wait in the group's single pending slot, where the newest replaces the older.
# That is the collapsing this block always wanted.
#
# Deliberately NOT `queue: max`: 100 pending runs would build every superseded
# commit in sequence on the one flaky Mac instead of only the newest.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45

    steps:
      - name: Checkout
        # Shallow on purpose. This repo is ~218 MB across 57 branches, and
        # fetch-depth: 0 made every build re-fetch all of it before doing any
        # work — which failed repeatedly mid-fetch ("RPC failed ... fatal: early
        # EOF") and surfaced as the misleading annotation "self-hosted runner
        # lost communication", pointing the investigation at the Mac rather than
        # at this line. Nothing in this job needs history: the build script runs
        # with --no-pull, the build number comes from App Store Connect, and the
        # only git calls below work fine at depth 1.
        uses: actions/checkout@v4

      - name: Show what triggered this
        run: |
          echo "event:  ${{ github.event_name }}"
          echo "commit: $(git rev-parse --short HEAD)"
          git log -1 --pretty='%s'

      - name: Unlock build keychain
        # Signing runs against a dedicated keychain, not the login keychain. A
        # runner started by launchd (svc.sh) cannot use login-keychain keys at
        # all: every codesign fails with errSecInternalComponent regardless of
        # partition lists, SessionCreate, or lock state. See docs/mac-build.md.
        #
        # build.keychain-db holds BOTH identities plus the WWDR G3 intermediate,
        # because it is alone on the search list and cannot borrow anything from
        # login.keychain. The archive signs with Apple Development; exportArchive
        # re-signs with Apple Distribution — a keychain holding only the
        # distribution identity fails before export is ever reached.
        #
        # NOTE: `security list-keychains -d user -s` replaces the USER's search
        # list, not just this job's — it outlives the job. The always() restore
        # step below is what keeps an interactive Xcode session working
        # afterwards. If a run is hard-killed mid-job and Xcode suddenly cannot
        # see your certificates, that restore is what didn't happen; re-run it
        # by hand:
        #   security list-keychains -d user -s ~/Library/Keychains/login.keychain-db
        env:
          BUILD_KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$HOME/Library/Keychains/build.keychain-db"
          security list-keychains -d user -s "$KEYCHAIN"
          security unlock-keychain -p "$BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"   # no auto-relock mid-archive

      - name: Build and upload to TestFlight
        # --no-pull because actions/checkout has already placed the tree at the
        # right commit; letting the script pull would race with the runner.
        #
        # No --commit on purpose. The script bumps CURRENT_PROJECT_VERSION in
        # project.pbxproj, and ios/** is in the path filter above — committing
        # that from CI would retrigger this workflow forever. The number is
        # reconciled against App Store Connect on every run, so the committed
        # value is a record, not the source of truth, and letting it go stale
        # costs nothing.
        run: ./scripts/ios-testflight.sh --no-pull

      - name: Restore keychain search list
        # Always, including on failure — see the note on the unlock step above.
        if: always()
        run: security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db"

      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Uploaded. Processing at App Store Connect usually takes 5-15 min."
          else
            echo "Build failed — the archive (if any) is under \$TMPDIR/futuregame.xcarchive."
            echo "Retry by hand: ./scripts/ios-testflight.sh --no-pull"
          fi
