# A hand link opened in the iPhone APP, in the simulator, on the Mac (owner, 2026-11-27: a shared hand opened from
# Discord into the app with the table under the clock and the buttons on the home bar, "This kind of thing just can
# not happen"). Everything is in scripts/app-link-check.sh: the app built for the simulator, a hand link opened in it
# cold and warm on each phone, the page's own report of where every piece sits against the window's safe area.
# ios-testflight.yml runs the same script on one phone before every upload; this runs it on three, on demand.
#
# Dispatch from Windows (one line; a full SHA as the ref, since "master" right after a push can check out the commit
# before it):
#   gh api repos/ethanibennett/futuregame-scheduler/dispatches -f event_type=app-link-check -F "client_payload[ref]=$(git rev-parse HEAD)"
# then: gh run download <run id> -n app-link-check
name: Hand link in the app (iPhone simulator)

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'A hand link (https://futurega.me/h/...)'
        default: 'https://futurega.me/h/dSXeHmQt'
      devices:
        description: 'Phones, ";" between them, "|" between names to try in turn'
        default: 'iPhone 17 Pro|iPhone 16 Pro;iPhone 17 Pro Max|iPhone 16 Pro Max;iPhone Air|iPhone 17|iPhone 16e'
  repository_dispatch:
    types: [app-link-check]

concurrency:
  group: app-link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 50
    env:
      LINK: ${{ github.event.client_payload.link || inputs.link || 'https://futurega.me/h/dSXeHmQt' }}
      DEVICES: ${{ github.event.client_payload.devices || inputs.devices || 'iPhone 17 Pro|iPhone 16 Pro;iPhone 17 Pro Max|iPhone 16 Pro Max;iPhone Air|iPhone 17|iPhone 16e' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - name: Open a hand link in the app on each phone
        run: ./scripts/app-link-check.sh

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-link-check
          path: out/
          retention-days: 7
